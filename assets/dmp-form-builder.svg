<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">DmpEServices dynamic form builder</title><desc id="desc">Form editor showing a component palette, registration form canvas and field configuration panel.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f1efff"/><stop offset="1" stop-color="#e6f5ef"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#34345c" flood-opacity=".12"/></filter></defs>
<rect width="1600" height="900" rx="34" fill="url(#bg)"/><rect x="48" y="48" width="1504" height="804" rx="24" fill="#fff" filter="url(#shadow)"/><rect x="48" y="48" width="1504" height="84" rx="24" fill="#20212b"/><rect x="48" y="106" width="1504" height="26" fill="#20212b"/><circle cx="94" cy="90" r="10" fill="#d9f36a"/><text x="124" y="98" fill="#fff" font-family="Arial,sans-serif" font-size="27" font-weight="700">DmpEServices</text><text x="410" y="98" fill="#bfc2d2" font-family="Arial,sans-serif" font-size="20">Dynamic form designer</text><rect x="1320" y="70" width="178" height="42" rx="9" fill="#d9f36a"/><text x="1409" y="97" text-anchor="middle" fill="#20212b" font-family="Arial,sans-serif" font-size="18" font-weight="700">Save form</text>
<rect x="48" y="132" width="280" height="720" fill="#f8f8fc"/><text x="82" y="190" fill="#777b8a" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2">COMPONENTS</text>
<g font-family="Arial,sans-serif" font-size="19" fill="#454858"><rect x="78" y="220" width="220" height="62" rx="10" fill="#fff" stroke="#e5e6ee"/><text x="98" y="258">▤  Text input</text><rect x="78" y="298" width="220" height="62" rx="10" fill="#fff" stroke="#e5e6ee"/><text x="98" y="336">☷  Select list</text><rect x="78" y="376" width="220" height="62" rx="10" fill="#fff" stroke="#e5e6ee"/><text x="98" y="414">▣  Date picker</text><rect x="78" y="454" width="220" height="62" rx="10" fill="#fff" stroke="#e5e6ee"/><text x="98" y="492">☑  Checkbox</text><rect x="78" y="532" width="220" height="62" rx="10" fill="#fff" stroke="#e5e6ee"/><text x="98" y="570">▥  File upload</text><rect x="78" y="610" width="220" height="62" rx="10" fill="#fff" stroke="#e5e6ee"/><text x="98" y="648">⊞  Section</text></g>
<text x="378" y="190" fill="#858998" font-family="Arial,sans-serif" font-size="18">FORM CANVAS / PRODUCT REGISTRATION</text><rect x="370" y="220" width="800" height="570" rx="18" fill="#fafaff" stroke="#e4e5ef" stroke-width="2"/>
<rect x="410" y="258" width="720" height="104" rx="12" fill="#fff" stroke="#e5e6ee"/><text x="445" y="302" fill="#252736" font-family="Arial,sans-serif" font-size="28" font-weight="700">Product registration</text><text x="445" y="334" fill="#858998" font-family="Arial,sans-serif" font-size="17">Complete the information required for your application.</text>
<g font-family="Arial,sans-serif"><text x="425" y="408" fill="#454858" font-size="18" font-weight="700">Product name *</text><rect x="420" y="425" width="330" height="60" rx="9" fill="#fff" stroke="#c9c4f1" stroke-width="2"/><text x="442" y="463" fill="#a0a2ad" font-size="17">Enter product name</text><text x="790" y="408" fill="#454858" font-size="18" font-weight="700">Registration category *</text><rect x="785" y="425" width="330" height="60" rx="9" fill="#fff" stroke="#e0e1e9"/><text x="807" y="463" fill="#a0a2ad" font-size="17">Choose a category</text>
<text x="425" y="535" fill="#454858" font-size="18" font-weight="700">Manufacturer</text><rect x="420" y="552" width="330" height="60" rx="9" fill="#fff" stroke="#e0e1e9"/><text x="442" y="590" fill="#a0a2ad" font-size="17">Company name</text><text x="790" y="535" fill="#454858" font-size="18" font-weight="700">Submission date</text><rect x="785" y="552" width="330" height="60" rx="9" fill="#fff" stroke="#e0e1e9"/><text x="807" y="590" fill="#a0a2ad" font-size="17">DD / MM / YYYY</text>
<rect x="420" y="650" width="695" height="92" rx="10" fill="#f5f3ff" stroke="#d4cff6" stroke-dasharray="7 6"/><text x="767" y="690" text-anchor="middle" fill="#7058e8" font-size="18" font-weight="700">＋  Add a field or section</text><text x="767" y="718" text-anchor="middle" fill="#9295a2" font-size="15">Drag components here to compose the form</text></g>
<rect x="1200" y="158" width="320" height="650" rx="14" fill="#fbfbfd" stroke="#e5e6ee"/><text x="1230" y="205" fill="#777b8a" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2">FIELD SETTINGS</text><text x="1230" y="260" fill="#454858" font-family="Arial,sans-serif" font-size="18" font-weight="700">Label</text><rect x="1230" y="278" width="260" height="52" rx="8" fill="#fff" stroke="#dfe1e9"/><text x="1248" y="311" fill="#454858" font-family="Arial,sans-serif" font-size="17">Product name</text><text x="1230" y="375" fill="#454858" font-family="Arial,sans-serif" font-size="18" font-weight="700">Validation</text><rect x="1230" y="393" width="260" height="52" rx="8" fill="#fff" stroke="#dfe1e9"/><text x="1248" y="426" fill="#858998" font-family="Arial,sans-serif" font-size="17">Text · Required</text><text x="1230" y="490" fill="#454858" font-family="Arial,sans-serif" font-size="18" font-weight="700">Conditional logic</text><rect x="1230" y="508" width="260" height="70" rx="9" fill="#eef8f4"/><circle cx="1260" cy="543" r="11" fill="#68b99d"/><text x="1285" y="550" fill="#3c806c" font-family="Arial,sans-serif" font-size="16">Show when category = X</text><text x="1230" y="632" fill="#454858" font-family="Arial,sans-serif" font-size="18" font-weight="700">Layout</text><rect x="1230" y="650" width="260" height="52" rx="8" fill="#fff" stroke="#dfe1e9"/><text x="1248" y="683" fill="#858998" font-family="Arial,sans-serif" font-size="17">Two-column grid</text><text x="1230" y="752" fill="#7058e8" font-family="Arial,sans-serif" font-size="16" font-weight="700">Advanced properties ↗</text></svg>